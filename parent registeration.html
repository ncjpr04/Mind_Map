<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMap - Parent Registration</title>
    <style>
        :root {
            --primary: #706fd3;
            --secondary: #4bcffa;
            --bg: #f7f9fc;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .reg-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 28px;
        }

        .header p {
            color: #636e72;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(112, 111, 211, 0.2);
        }

        .phone-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .prefix {
            background: #eee;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #5d5bc0;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .success-msg {
            display: none;
            background: #e6ffed;
            color: #27ae60;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="reg-card">
        <div class="header">
            <h2>Parent Registration 👨‍👩‍👧</h2>
            <p>Join MindMap to monitor your child's wellbeing</p>
        </div>

        <form id="regForm">
            <div class="form-group">
                <label>Parent Full Name</label>
                <input type="text" id="parentName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Child's Name</label>
                <input type="text" id="childName" placeholder="Enter child's name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="parentEmail" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>WhatsApp Alert Number</label>
                <div class="phone-input">
                    <span class="prefix">+91</span>
                    <input type="text" id="parentPhone" placeholder="8000864380" maxlength="10" required>
                </div>
            </div>

            <button type="submit">Create Account</button>
             <p id="msg" class="msg"></p>

  <a href="parents login.html">⬅ Back to Login</a>
        </form>

        <div id="successBox" class="success-msg">
            Registration Successful! Redirecting...
        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Collect data
            const parentData = {
                name: document.getElementById('parentName').value,
                child: document.getElementById('childName').value,
                email: document.getElementById('parentEmail').value,
                phone: "+91" + document.getElementById('parentPhone').value
            };

            // Basic Validation
            if (document.getElementById('parentPhone').value.length !== 10) {
                alert("Please enter a valid 10-digit phone number.");
                return;
            }

            // Save to LocalStorage (for demo purposes)
            localStorage.setItem('mindmap_parent', JSON.stringify(parentData));

            // Show success and redirect
            const successBox = document.getElementById('successBox');
            successBox.style.display = 'block';

            setTimeout(() => {
                // Redirect to your Parent Dashboard or Alert page
                 window.location.href = 'parent-alert.html';  
            }, 2000);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindMap Admin – Combined Panel 🔐</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 { text-align: center; color: #706fd3; margin-bottom: 30px; }
    h2 { color: #555; border-left: 5px solid #706fd3; padding-left: 15px; margin-top: 40px; }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #eee;
      padding: 12px;
      text-align: center;
    }

    th {
      background: #706fd3;
      color: white;
      font-size: 13px;
      text-transform: uppercase;
    }

    tr:nth-child(even) { background: #f9f9f9; }

    .btn-wa {
      background: #25D366;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
    }

    .clear-btn {
      background: #ff7675;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      float: right;
    }

    .empty-msg { color: #b2bec3; font-style: italic; padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h1>MindMap – Global Admin Dashboard 👀</h1>

  <h2>Child Registrations (Assessment Panel)</h2>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Child Name</th>
          <th>Age</th>
          <th>Parent Email</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="child-data"></tbody>
    </table>
  </div>

  <h2>Parent Registrations (Contact Panel)</h2>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Parent Name</th>
          <th>Child Name</th>
          <th>Email</th>
          <th>WhatsApp (+91)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="parent-data"></tbody>
    </table>
  </div>
  
  <button class="clear-btn" onclick="clearAll()">Clear All Records</button>
</div>

<script>
  function loadPanels() {
    // 1. Load Child Data (using your key 'registrations')
    const childRegs = JSON.parse(localStorage.getItem("registrations")) || [];
    const childBody = document.getElementById("child-data");
    childBody.innerHTML = "";

    if (childRegs.length === 0) {
      childBody.innerHTML = "<tr><td colspan='5' class='empty-msg'>No child registrations found</td></tr>";
    } else {
      childRegs.forEach((r, i) => {
        childBody.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${r.name}</td>
            <td>${r.age}</td>
            <td>${r.email}</td>
            <td>${r.time}</td>
          </tr>`;
      });
    }

    // 2. Load Parent Data (using key 'parent_registrations')
    // Ensure your Parent Registration page saves to this key!
    const parentRegs = JSON.parse(localStorage.getItem("parent_registrations")) || [];
    const parentBody = document.getElementById("parent-data");
    parentBody.innerHTML = "";

    if (parentRegs.length === 0) {
      parentBody.innerHTML = "<tr><td colspan='6' class='empty-msg'>No parent contact data found</td></tr>";
    } else {
      parentRegs.forEach((p, i) => {
        const waLink = `https://wa.me/${p.phone}?text=MindMap Alert: Please check the dashboard for ${p.child}.`;
        parentBody.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td><strong>${p.name}</strong></td>
            <td>${p.child}</td>
            <td>${p.email}</td>
            <td>${p.phone}</td>
            <td><a href="${waLink}" target="_blank" class="btn-wa">Send WhatsApp Alert 📲</a></td>
          </tr>`;
      });
    }
  }

  function clearAll() {
    if(confirm("Delete all child and parent data?")) {
      localStorage.removeItem("registrations");
      localStorage.removeItem("parent_registrations");
      loadPanels();
    }
  }

  // Load everything on startup
  loadPanels();
</script>

</body>
</html>
